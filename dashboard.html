<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="css/summary.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="js/check-auth.js"></script>
    <script src="js/audio-utils.js"></script>
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <h2>Expense Tracker</h2>
            <ul class="nav-links">
                <li><a href="index.html"><button>Transactions</button></a></li>
                <li><a href="dashboard.html" class="active"><button>Dashboard</button></a></li>
                <li><a href="about.html"><button>About</button></a></li>
                <li><button onclick="logout()" class="logout-btn">Logout</button></li>
            </ul>
        </div>
        <div class="user-info">Welcome, <span id="username"></span></div>
    </nav>

    <div id="notification" class="notification" style="display: none;"></div>
    <div class="container dashboard">
        <div class="dashboard-grid">
            <div class="card overview-card">
                <h3>Monthly Overview</h3>
                <div class="stats-grid">
                    <div class="stat-item">
                        <p class="stat-label">This Month's Income</p>
                        <p class="stat-value" id="monthly-income">$0.00</p>
                    </div>
                    <div class="stat-item">
                        <p class="stat-label">This Month's Expenses</p>
                        <p class="stat-value" id="monthly-expenses">$0.00</p>
                    </div>
                    <div class="stat-item">
                        <p class="stat-label">Monthly Savings</p>
                        <p class="stat-value" id="monthly-savings">$0.00</p>
                    </div>
                    <div class="stat-item">
                        <p class="stat-label">Expense Rate</p>
                        <p class="stat-value" id="expense-rate">0%</p>
                    </div>
                </div>
            </div>

            <div class="card totals-card">
                <h3>Totals Overview</h3>
                <div class="totals-chart-wrapper" style="height:240px;">
                    <canvas id="totals-chart"></canvas>
                </div>
            </div>

            <!-- Expense Categories removed per request -->

            <div class="card">
                <h3>Income vs Expenses</h3>
                <canvas id="income-expense-chart"></canvas>
            </div>



            <div class="card">
                <h3>Monthly Trend</h3>
                <canvas id="monthly-trend-chart"></canvas>
            </div>

            <div class="card budget-card">
                <h3>Budget Overview</h3>
                <div class="budget-form">
                    <input type="number" id="budget-amount" placeholder="Set monthly budget" disabled>
                    <div class="budget-actions">
                        <button id="edit-budget-btn" class="btn">Edit</button>
                        <button id="set-budget-btn" class="btn primary">Save</button>
                        <button id="reset-budget-btn" class="btn danger">Reset</button>
                    </div>
                </div>
                <div class="budget-progress">
                    <div class="progress-bar">
                        <div class="progress" id="budget-progress"></div>
                    </div>
                    <p class="budget-text">Budget used: <span id="budget-percentage">0%</span></p>
                    <div class="budget-numbers">
                        <p>Budget: ₹<span id="budget-total">0.00</span></p>
                        <p>Used: ₹<span id="budget-used">0.00</span></p>
                        <p>Remaining: ₹<span id="budget-remaining">0.00</span></p>
                    </div>
                    <!-- Presets removed -->
                    <div class="budget-sparkline" style="height:80px; margin-top:10px;">
                        <canvas id="budget-sparkline"></canvas>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="js/dashboard.js"></script>
    <script>document.getElementById('username').textContent = sessionStorage.getItem('currentUser');</script>
</body>
</html>
