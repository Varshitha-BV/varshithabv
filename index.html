<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Expense Tracker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="css/transactions.css">
</head>
<body>
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <nav class="navbar">
        <div class="nav-container">
            <h2>Expense Tracker</h2>
            <ul class="nav-links">
                <li><a href="index.html" class="active"><button>Transactions</button></a></li>
                <li><a href="dashboard.html"><button>Dashboard</button></a></li>
                <li><a href="about.html"><button>About</button></a></li>
                <li><button onclick="logout()" class="logout-btn">Logout</button></li>
            </ul>
        </div>
        <div class="user-info">Welcome, <span id="username"></span></div>
    </nav>
    <div class="container">
        <h1>Personal Expense Tracker</h1>
        
        <div class="stats-row">
            <div class="stat-card total-balance">
                <div class="stat-info">
                    <h2>Total Balance</h2>
                    <h3 id="balance">₹0.00</h3>
                </div>
            </div>
            
            <div class="stat-card total-income">
                <div class="stat-info">
                    <h2>Total Income</h2>
                    <h3 id="income-amount">₹0.00</h3>
                </div>
            </div>
            
            <div class="stat-card total-expense">
                <div class="stat-info">
                    <h2>Total Expense</h2>
                    <h3 id="expense-amount">₹0.00</h3>
                </div>
            </div>
        </div>

        <div class="transaction-container">
            <h3>Add New Transaction</h3>
            <form id="transaction-form">

                <div class="form-row">
                    <div class="form-control">
                        <label for="amount">Amount</label>
                        <input type="number" id="amount" placeholder="Enter amount" required step="0.01">
                    </div>
                    <div class="form-control">
                        <label for="transaction-type">Type</label>
                        <select id="transaction-type" required>
                            <option value="expense">Expense</option>
                            <option value="income">Income</option>
                        </select>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-control">
                        <label for="category">Category</label>
                        <select id="category" required>
                            <option value="">Select Category</option>
                            <optgroup label="Expenses">
                                <option value="groceries">Groceries</option>
                                <option value="utilities">Utilities</option>
                                <option value="rent">Rent</option>
                                <option value="transportation">Transportation</option>
                                <option value="entertainment">Entertainment</option>
                                <option value="healthcare">Healthcare</option>
                                <option value="shopping">Shopping</option>
                                <option value="other-expense">Other</option>
                            </optgroup>
                            <optgroup label="Income">
                                <option value="salary">Salary</option>
                                <option value="freelance">Freelance</option>
                                <option value="investments">Investments</option>
                                <option value="other-income">Other</option>
                            </optgroup>
                        </select>
                    </div>
                    <div class="form-control">
                        <label for="date">Date</label>
                        <input type="date" id="date" required>
                    </div>
                </div>
                <div class="form-control">
                    <label for="notes">Notes (Optional)</label>
                    <textarea id="notes" placeholder="Add any additional notes..."></textarea>
                </div>
                <button type="submit" class="btn">Add Transaction</button>
            </form>
        </div>

        <!-- Transaction List -->
        <div class="transaction-list-container">
            <div class="transaction-list-header">
                <h3>Transaction History</h3>
                <button id="clear-btn" class="btn clear-btn" type="button">Clear All</button>
            </div>
            <ul id="transaction-list" class="list"></ul>
        </div>
    </div>
    <script src="js/check-auth.js"></script>
    <script>
        try {
            const uname = currentUser;
            const users = JSON.parse(localStorage.getItem('users')) || {};
            const display = users[uname] && users[uname].displayName ? users[uname].displayName : uname;
            document.getElementById('username').textContent = display;
        } catch (err) {
            document.getElementById('username').textContent = currentUser;
        }
    </script>
    <script src="js/script.js"></script>
</body>
</html>
