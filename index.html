<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Expense Tracker</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <h2>Expense Tracker</h2>
            <ul class="nav-links">
                <li><a href="index.html" class="active"><button>Transactions</button></a></li>
                <li><a href="dashboard.html"><button>Dashboard</button></a></li>
                <li><a href="about.html"><button>About</button></a></li>
                <li><button onclick="logout()" class="logout-btn">Logout</button></li>
            </ul>
        </div>
        <div class="user-info">Welcome, <span id="username"></span></div>
    </nav>
    <div class="container">
        <h1>Personal Expense Tracker</h1>
        
        <div class="balance-container">
            <h2>Your Balance</h2>
            <h3 id="balance">$0.00</h3>
        </div>

        <div class="summary">
            <div class="income">
                <h4>Income</h4>
                <p id="income-amount">$0.00</p>
            </div>
            <div class="expenses">
                <h4>Expenses</h4>
                <p id="expense-amount">$0.00</p>
            </div>
        </div>

        <div class="transaction-container">
            <h3>Add New Transaction</h3>
            <form id="transaction-form">
                <div class="form-control">
                    <label for="description">Description</label>
                    <input type="text" id="description" placeholder="Enter description..." required>
                </div>
                <div class="form-row">
                    <div class="form-control">
                        <label for="amount">Amount</label>
                        <input type="number" id="amount" placeholder="Enter amount..." required step="0.01">
                    </div>
                    <div class="form-control">
                        <label for="transaction-type">Type</label>
                        <select id="transaction-type" required>
                            <option value="expense">Expense</option>
                            <option value="income">Income</option>
                        </select>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-control">
                        <label for="category">Category</label>
                        <select id="category" required>
                            <option value="">Select Category</option>
                            <optgroup label="Expenses">
                                <option value="groceries">Groceries</option>
                                <option value="utilities">Utilities</option>
                                <option value="rent">Rent</option>
                                <option value="transportation">Transportation</option>
                                <option value="entertainment">Entertainment</option>
                                <option value="healthcare">Healthcare</option>
                                <option value="shopping">Shopping</option>
                                <option value="other-expense">Other</option>
                            </optgroup>
                            <optgroup label="Income">
                                <option value="salary">Salary</option>
                                <option value="freelance">Freelance</option>
                                <option value="investments">Investments</option>
                                <option value="other-income">Other</option>
                            </optgroup>
                        </select>
                    </div>
                    <div class="form-control">
                        <label for="date">Date</label>
                        <input type="date" id="date" required>
                    </div>
                </div>
                <div class="form-control">
                    <label for="notes">Notes (Optional)</label>
                    <textarea id="notes" placeholder="Add any additional notes..."></textarea>
                </div>
                <button type="submit" class="btn">Add Transaction</button>
            </form>
        </div>

        <div class="history-container">
            <div class="history-header">
                <h3>Transaction History</h3>
                <div class="list-controls">
                    <div class="filter-controls">
                        <select id="filter-type" class="control-btn">
                            <option value="all">All Types</option>
                            <option value="income">Income</option>
                            <option value="expense">Expense</option>
                        </select>
                        <select id="filter-category" class="control-btn">
                            <option value="all">All Categories</option>
                            <optgroup label="Expenses">
                                <option value="groceries">Groceries</option>
                                <option value="utilities">Utilities</option>
                                <option value="rent">Rent</option>
                                <option value="transportation">Transportation</option>
                                <option value="entertainment">Entertainment</option>
                                <option value="healthcare">Healthcare</option>
                                <option value="shopping">Shopping</option>
                                <option value="other-expense">Other</option>
                            </optgroup>
                            <optgroup label="Income">
                                <option value="salary">Salary</option>
                                <option value="freelance">Freelance</option>
                                <option value="investments">Investments</option>
                                <option value="other-income">Other</option>
                            </optgroup>
                        </select>
                    </div>
                    <div class="sort-controls">
                        <button id="sort-date" class="control-btn">
                            Sort by Date <span class="sort-icon">↓</span>
                        </button>
                        <button id="sort-amount" class="control-btn">
                            Sort by Amount <span class="sort-icon">↓</span>
                        </button>
                    </div>
                </div>
            </div>
            <ul id="transaction-list" class="list">
                <!-- Transactions will be added here dynamically -->
            </ul>
        </div>
    </div>
    <script src="js/check-auth.js"></script>
    <script>document.getElementById('username').textContent = currentUser;</script>
    <script src="js/script.js"></script>
</body>
</html>
